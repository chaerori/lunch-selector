<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF1F4">
  <title>오늘 점심 뭐 먹지?</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>오늘 점심 뭐 먹지?</h1>
    </header>

    <section class="hero" aria-live="polite">
      <div id="result" class="hero-name"></div>
      <div id="result-meta" class="hero-meta"></div>
      <svg class="hero-art" viewBox="0 0 96 96" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9">
          <path d="M34 26c-5-5 5-8 0-14"/>
          <path d="M48 24c-5-5 5-8 0-14"/>
          <path d="M62 26c-5-5 5-8 0-14"/>
        </g>
        <path d="M18 52c0-15 12-24 30-24s30 9 30 24z" fill="#fff"/>
        <g stroke="#7a3f0a" stroke-width="3.5" stroke-linecap="round">
          <path d="M60 40 90 12"/>
          <path d="M68 44 94 20"/>
        </g>
        <path d="M10 52h76c0 20-15 34-38 34S10 72 10 52z" fill="#c8631a"/>
        <path d="M17 62h62" stroke="#ffd9a3" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 86h24v4H36z" fill="#c8631a"/>
      </svg>
      <a id="result-link" class="hero-link" hidden target="_blank" rel="noopener noreferrer">지도 열기</a>
    </section>

    <section>
      <div class="section-head">
        <h2>오늘은 패스할 음식</h2>
      </div>
      <div id="filters" class="chips"></div>
      <p id="filter-hint" class="hint"></p>
    </section>

    <section>
      <div class="section-head">
        <h2>식당 목록 <span id="count"></span></h2>
        <button id="open-add" type="button" class="text-btn">식당 추가</button>
      </div>
      <p id="status" class="status" role="status" hidden></p>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>아직 식당이 없어요. 자주 가는 곳부터 추가해 보세요.</p>
    </section>
  </main>

  <div class="dock">
    <button id="pick" type="button">점심 뽑기</button>
  </div>

  <dialog id="sheet">
    <form id="add-form" method="dialog">
      <div class="sheet-head">
        <h2 id="sheet-title">새 식당 추가</h2>
        <button type="button" id="close-add" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <label>식당 이름
        <input id="name" type="text" maxlength="40" placeholder="예: 할매국밥" required autocomplete="off">
      </label>
      <label>카테고리 <span class="opt">쉼표로 여러 개</span>
        <input id="category" type="text" maxlength="60" list="category-options" placeholder="예: 한식, 일식, 국밥" required autocomplete="off">
        <datalist id="category-options"></datalist>
      </label>
      <label>지도 링크 <span class="opt">선택</span>
        <input id="url" type="url" placeholder="https://" autocomplete="off">
      </label>
      <button id="submit-btn" type="submit" class="primary">추가</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
