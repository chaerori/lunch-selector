<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF1F4">
  <title>오늘 점심 뭐 먹지?</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>오늘 점심 뭐 먹지?</h1>
    </header>

    <section class="hero" aria-live="polite">
      <div id="result" class="hero-name"></div>
      <div id="result-meta" class="hero-meta"></div>
      <svg class="hero-art" viewBox="0 0 96 96" aria-hidden="true"></svg>
      <a id="result-link" class="hero-link" hidden target="_blank" rel="noopener noreferrer">지도 열기</a>
    </section>
    <button id="pick" type="button">점심 뽑기</button>

    <section>
      <div class="section-head">
        <h2>오늘은 패스할 음식</h2>
      </div>
      <p id="filter-hint" class="hint"></p>
      <div id="filters" class="chips"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>식당 목록 <span id="count"></span></h2>
        <button id="open-add" type="button" class="add-btn" aria-label="식당 추가"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
      </div>
      <p id="status" class="status" role="status" hidden></p>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>아직 식당이 없어요. 자주 가는 곳부터 추가해 보세요.</p>
    </section>
  </main>


  <dialog id="sheet">
    <form id="add-form" method="dialog">
      <div class="sheet-head">
        <h2 id="sheet-title">새 식당 추가</h2>
        <button type="button" id="close-add" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <label>식당 이름
        <input id="name" type="text" maxlength="40" placeholder="예: 할매국밥" required autocomplete="off">
      </label>
      <label>카테고리 <span class="opt">쉼표로 여러 개</span>
        <input id="category" type="text" maxlength="60" list="category-options" placeholder="예: 한식, 일식, 국밥" required autocomplete="off">
        <datalist id="category-options"></datalist>
      </label>
      <label>지도 링크 <span class="opt">선택</span>
        <input id="url" type="url" placeholder="https://" autocomplete="off">
      </label>
      <button id="submit-btn" type="submit" class="primary">추가</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
